<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <!-- Fond : dégradé sphérique violet profond -->
    <radialGradient id="bg" cx="40%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#3b2f6e"/>
      <stop offset="55%"  stop-color="#1a1433"/>
      <stop offset="100%" stop-color="#0d0b1e"/>
    </radialGradient>

    <!-- Onglet 3 (arrière, gris-bleu) -->
    <linearGradient id="tab3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a3c54"/>
      <stop offset="100%" stop-color="#22243a"/>
    </linearGradient>

    <!-- Onglet 2 (milieu, violet moyen) -->
    <linearGradient id="tab2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5c4a9e"/>
      <stop offset="100%" stop-color="#3a2d7a"/>
    </linearGradient>

    <!-- Onglet 1 (avant, violet vif) -->
    <linearGradient id="tab1top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4aaff"/>
      <stop offset="40%"  stop-color="#b47ef7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Reflet sur l'onglet avant -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>

    <!-- Barre URL : dégradé sombre -->
    <linearGradient id="urlbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2e1f6a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0a0714" flood-opacity="0.75"/>
    </filter>

    <!-- Lueur violette sur l'onglet avant -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip arrondi global -->
    <clipPath id="round-clip">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110"/>
    </clipPath>

  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Étoiles / particules lumineuses -->
  <g opacity="0.35">
    <circle cx="72"  cy="68"  r="2.2" fill="#c4b5fd"/>
    <circle cx="440" cy="90"  r="1.8" fill="#a78bfa"/>
    <circle cx="390" cy="44"  r="1.4" fill="#e9d5ff"/>
    <circle cx="130" cy="450" r="1.6" fill="#a78bfa"/>
    <circle cx="460" cy="400" r="2.0" fill="#c4b5fd"/>
    <circle cx="55"  cy="380" r="1.5" fill="#ddd6fe"/>
    <circle cx="260" cy="55"  r="1.2" fill="#ede9fe"/>
    <circle cx="480" cy="240" r="1.6" fill="#c4b5fd"/>
  </g>

  <!-- Groupe principal centré + ombre -->
  <g filter="url(#shadow)" clip-path="url(#round-clip)">

    <!-- ONGLET 3 — arrière (décalé bas-droite pour perspective) -->
    <rect x="138" y="238" width="288" height="170" rx="22" ry="22"
          fill="url(#tab3)" opacity="0.9"/>
    <!-- Tranche basse 3D -->
    <rect x="138" y="386" width="288" height="14" rx="6" ry="6"
          fill="#16182a" opacity="0.6"/>

    <!-- ONGLET 2 — milieu -->
    <rect x="100" y="192" width="288" height="170" rx="22" ry="22"
          fill="url(#tab2)"/>
    <!-- Tranche basse 3D -->
    <rect x="100" y="340" width="288" height="14" rx="6" ry="6"
          fill="#200f50" opacity="0.55"/>
    <!-- Ligne de séparation header/contenu -->
    <rect x="100" y="232" width="288" height="2" rx="1"
          fill="rgba(255,255,255,0.06)"/>
    <!-- Petits faux boutons dans l'onglet 2 -->
    <rect x="120" y="260" width="120" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
    <rect x="120" y="280" width="80"  height="8"  rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="120" y="296" width="100" height="8"  rx="4" fill="rgba(255,255,255,0.06)"/>

    <!-- ONGLET 1 — avant (principal, effet 3D) -->
    <g filter="url(#glow)">
      <rect x="62" y="148" width="288" height="170" rx="22" ry="22"
            fill="url(#tab1top)"/>
    </g>
    <!-- Tranche basse 3D (épaisseur) -->
    <rect x="62" y="296" width="288" height="16" rx="7" ry="7"
          fill="#4c1d95" opacity="0.7"/>
    <!-- Tranche droite 3D -->
    <polygon points="350,148 366,162 366,312 350,296" fill="#5b21b6" opacity="0.5"/>

    <!-- Barre de titre onglet avant -->
    <rect x="62" y="148" width="288" height="44" rx="22" ry="22"
          fill="rgba(0,0,0,0.18)"/>
    <rect x="62" y="170"  width="288" height="22" fill="rgba(0,0,0,0.18)"/>

    <!-- Pastilles de contrôle (close/min/max) -->
    <circle cx="98"  cy="170" r="9" fill="#ff5f57" opacity="0.95"/>
    <circle cx="124" cy="170" r="9" fill="#febc2e" opacity="0.95"/>
    <circle cx="150" cy="170" r="9" fill="#28c840" opacity="0.95"/>

    <!-- Barre URL -->
    <rect x="172" y="158" width="156" height="24" rx="12"
          fill="url(#urlbar)" opacity="0.85"/>
    <!-- Reflet sur barre URL -->
    <rect x="176" y="159" width="100" height="10" rx="5"
          fill="rgba(255,255,255,0.07)"/>

    <!-- Contenu simulé dans l'onglet avant -->
    <rect x="82"  y="208" width="140" height="11" rx="5" fill="rgba(255,255,255,0.22)"/>
    <rect x="82"  y="228" width="200" height="8"  rx="4" fill="rgba(255,255,255,0.12)"/>
    <rect x="82"  y="244" width="170" height="8"  rx="4" fill="rgba(255,255,255,0.10)"/>
    <rect x="82"  y="260" width="110" height="8"  rx="4" fill="rgba(255,255,255,0.08)"/>

    <!-- Reflet glossy sur l'onglet avant -->
    <rect x="62" y="148" width="288" height="80" rx="22" ry="22"
          fill="url(#gloss)" opacity="0.55"/>

    <!-- Petit badge bookmark en bas à droite -->
    <rect x="316" y="270" width="28" height="34" rx="5"
          fill="#7c3aed" opacity="0.9"/>
    <polygon points="316,304 330,296 344,304" fill="#4c1d95"/>

  </g>

  <!-- Lueur ambiante en bas -->
  <ellipse cx="256" cy="490" rx="140" ry="22" fill="#7c3aed" opacity="0.20"/>

</svg>
